# ============================================================
#  ${plugin.name} - database connection
#  Keep this file out of version control if it holds real
#  credentials. The plugin runs fine with enabled: false.
# ============================================================

# Master switch. When false, no connection is opened and the
# plugin works without a database.
enabled: false

# Backend type: H2, MYSQL or POSTGRESQL
#
#   H2         embedded, file-backed, needs no server and no
#              setup - just flip enabled to true
#   MYSQL      external server, uses host/port/database below
#   POSTGRESQL external server, uses host/port/database below
type: H2

# --- Embedded backends (H2) ---------------------------------
# Database file. A relative path is resolved against this
# plugin's own folder; H2 appends .mv.db itself, so leave the
# extension off. host, port, database and the properties
# section below are ignored by H2.
file: data

# --- Server backends (MYSQL, POSTGRESQL) --------------------
host: localhost
port: 3306
database: minecraft
username: root
password: ""

pool:
  # Maximum number of pooled connections
  maximum-pool-size: 10
  # How long to wait (ms) for a connection before failing
  connection-timeout-ms: 30000

# Extra JDBC driver properties (optional). Ignored by H2,
# whose driver rejects settings it does not know.
properties:
  useSSL: "false"
  characterEncoding: "utf8"
